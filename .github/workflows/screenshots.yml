name: README screenshots

# Builds the app and captures clean, cropped window screenshots with built-in sample data
# (LESSONNOTES_DEMO). Images are printed to the log as base64 so they can be added to docs/images.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: ["docs/screenshots.request"]

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project LessonNotes.xcodeproj -scheme LessonNotes -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -50; exit 1; }
      - name: Capture
        run: |
          APP="build/Build/Products/Release/Lesson Notes.app"
          TMPF="$HOME/Library/Containers/com.georgehalltuition.lessonnotes/Data/tmp/lessonnotes-window.json"
          mkdir -p shots
          for SPEC in videos:light videos:dark files:light usage:light dashboard:light review:light regenerate:light history:light students:light settings:light dashboard:dark history:dark; do
            MODE=${SPEC%%:*}; LOOK=${SPEC##*:}; NAME="$MODE-$LOOK"
            rm -f "$TMPF"
            LESSONNOTES_DEMO=$MODE LESSONNOTES_APPEARANCE=$LOOK "$APP/Contents/MacOS/LessonNotes" > /dev/null 2>&1 &
            PID=$!
            sleep 11
            screencapture -x "shots/$NAME-full.png" || true
            kill $PID 2>/dev/null || true
            sleep 1
            if [ -f "shots/$NAME-full.png" ] && [ -f "$TMPF" ]; then
              python3 - "$TMPF" "shots/$NAME-full.png" > "shots/$NAME.crop" <<'PY'
          import json, subprocess, sys
          f = json.load(open(sys.argv[1]))
          out = subprocess.run(["sips", "-g", "pixelWidth", sys.argv[2]], capture_output=True, text=True).stdout
          pw = int(out.split()[-1])
          s = pw / f["sw"]
          print(int(f["h"] * s), int(f["w"] * s), int(f["y"] * s), int(f["x"] * s))
          PY
              read H W Y X < "shots/$NAME.crop"
              sips -c "$H" "$W" --cropOffset "$Y" "$X" "shots/$NAME-full.png" --out "shots/$NAME.png" > /dev/null
              sips -Z 1400 -s format jpeg -s formatOptions 82 "shots/$NAME.png" --out "shots/$NAME.jpg" > /dev/null
              echo "SHOT:$NAME:$(base64 -i "shots/$NAME.jpg" | tr -d '\n')"
            else
              echo "No screenshot for $NAME"
            fi
          done
