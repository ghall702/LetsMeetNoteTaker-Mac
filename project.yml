name: LessonNotes
options:
  bundleIdPrefix: com.georgehalltuition
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  LessonNotesCore:
    path: Packages/LessonNotesCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LessonNotes:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: LessonNotesCore
      - package: WhisperKit
        product: WhisperKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Lesson Notes
        CFBundleDisplayName: Let's Meet Lesson Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© George Hall Tuition"
        NSPrincipalClass: NSApplication
    entitlements:
      path: App/LessonNotes.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgehalltuition.lessonnotes
        PRODUCT_NAME: Lesson Notes
        EXECUTABLE_NAME: LessonNotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
