# SFTPGo + media gateway + Caddy (HTTPS). Fits comfortably in 3 GB RAM.
services:
  sftpgo:
    image: drakkan/sftpgo:v2-alpine
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host                   # SFTP on :2022; admin UI 127.0.0.1:8080 only
    volumes:
      - /srv/sftpgo/data:/srv/sftpgo/data
      - /srv/sftpgo/home:/var/lib/sftpgo
    environment:
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: "127.0.0.1"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
    mem_limit: 512m
  gateway:
    image: node:20-alpine
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["node", "gateway.mjs"]
    volumes:
      - ./gateway.mjs:/app/gateway.mjs:ro
      - /srv/sftpgo/data/recordings:/srv/recordings
    environment:
      MEDIA_GATEWAY_SECRET: ${MEDIA_GATEWAY_SECRET:?set in .env}
      DATA_DIR: /srv/recordings
      PORT: "8787"
      ALLOWED_ORIGINS: "https://georgehalltuition.com,https://www.georgehalltuition.com,https://george-hall-reimagined.lovable.app"
    ports: ["127.0.0.1:8787:8787"]
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 128m
volumes:
  caddy_data:
